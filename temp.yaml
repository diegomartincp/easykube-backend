# issuer-lets-encrypt-staging.yaml
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-staging-xd
  namespace: default
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ejemplo@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-xd
    solvers:
    - http01:
        ingress:
          name: app-name
