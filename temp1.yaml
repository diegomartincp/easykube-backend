apiVersion: apps/v1
kind: Deployment
metadata:
  name: miapp-deployment
  namespace: default
  labels:
    app: miapp
spec:
  selector:
    matchLabels:
      app: miapp
  replicas: 4
  template:
    metadata:
      labels:
        app: miapp
    spec:
      #CONTENEDORE CON NGINX
      containers:
      - image: nginx
        name: nginx-git-cloned
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: www-data
      #CONTENEDORE CON EL GIT-CLONER
      initContainers:
      - name: git-cloner
        image: alpine/git
        args:
            - clone
            - https://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@github.com/diegomartincp/webpage_private_example.git
            - /data
        volumeMounts:
        - mountPath: /data
          name: www-data
      volumes:
      - name: www-data
        emptyDir: {}
